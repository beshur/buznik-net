# Builds dist/ with bun and publishes it as a GitHub release (dist.zip),
# then pings the server webhook (trigger_deploy.php -> deploy.sh), which
# downloads the latest release into www/ and runs dist/cron.sh there.

name: Build Assets

on:
  push:
    branches:
      - "master"
      - "deploy"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: zip -r dist.zip dist/*

      - name: Get short SHA
        id: sha_short
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "dist.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.sha_short.outputs.sha_short }}
          name: "Release (${{ steps.sha_short.outputs.sha_short }})"
          draft: false
          prerelease: false
          makeLatest: true

      - name: Invoke deployment hook
        uses: distributhor/workflow-webhook@v1
        env:
          webhook_url: ${{ secrets.webhook_url }}
          webhook_secret: ${{ secrets.webhook_secret }}
          webhook_auth: "deploy:${{ secrets.webhook_code }}"
